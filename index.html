<style>
/* Fonts bundled locally so the app works offline */
@font-face { font-family: "Frank Ruhl Libre"; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/frank-ruhl-libre-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Frank Ruhl Libre"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/frank-ruhl-libre-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Frank Ruhl Libre"; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/frank-ruhl-libre-hebrew-500-normal.woff2) format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: "Frank Ruhl Libre"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/frank-ruhl-libre-hebrew-700-normal.woff2) format("woff2"); unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: "Atkinson Hyperlegible"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Atkinson Hyperlegible"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

/* Base reset + Android safe areas (Capacitor injects --safe-area-inset-*) */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --inset-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
  --inset-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  --inset-left: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
  --inset-right: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
  padding: var(--inset-top) var(--inset-right) 0 var(--inset-left);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body { margin: 0; overscroll-behavior-y: none; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Layout: one phone-width column; screens swap in place. The keshet (rainbow arc of the covenant, Gen 9:13) is the single bold element: brand mark on home, progress gauge in play. */
:root {
  --bg: #E9EEF2;
  --surface: #FFFFFF;
  --ink: #16203A;
  --muted: #56627A;
  --line: #D0D8E1;
  --accent: #2B4A9E;
  --accent-ink: #FFFFFF;
  --accent-soft: #DEE6F7;
  --good: #2C7A55;
  --good-soft: #DDEFE5;
  --bad: #B3443A;
  --bad-soft: #F6E1DE;
  --k1: #C4553F; --k2: #D8873A; --k3: #D2AA3C; --k4: #5C9A6A; --k5: #3A8AAE; --k6: #3B55A3; --k7: #7B5A9E;
  --f-display: "Frank Ruhl Libre", "Iowan Old Style", "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1320; --surface: #171E30; --ink: #E7EBF3; --muted: #9AA4B9; --line: #2A3350;
    --accent: #8EA6EE; --accent-ink: #0E1320; --accent-soft: #222D4B;
    --good: #5DBE8C; --good-soft: #16302A; --bad: #EA8277; --bad-soft: #3A1F1F;
    --k1: #E0765F; --k2: #EDA257; --k3: #E6C45E; --k4: #7DBA8A; --k5: #5FA9CB; --k6: #7088D6; --k7: #A385C4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1320; --surface: #171E30; --ink: #E7EBF3; --muted: #9AA4B9; --line: #2A3350;
  --accent: #8EA6EE; --accent-ink: #0E1320; --accent-soft: #222D4B;
  --good: #5DBE8C; --good-soft: #16302A; --bad: #EA8277; --bad-soft: #3A1F1F;
  --k1: #E0765F; --k2: #EDA257; --k3: #E6C45E; --k4: #7DBA8A; --k5: #5FA9CB; --k6: #7088D6; --k7: #A385C4;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.app {
  max-width: 30rem;
  min-height: 100%;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 0;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
.he { font-family: var(--f-display); direction: rtl; unicode-bidi: isolate; }

/* ---------- Home ---------- */
.brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.brand svg { width: 100%; max-width: 250px; height: auto; display: block; }
.band { fill: none; stroke-width: 7; }
.hero-he { font-family: var(--f-display); font-size: 25px; font-weight: 700; fill: var(--ink); }
.brand h1 {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 2.15rem;
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0;
  text-wrap: balance;
}
.tagline { margin: 0; color: var(--muted); max-width: 34ch; text-wrap: balance; }

.label {
  margin: 0 0 10px;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}

.btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: 100%;
  min-height: 52px;
  padding: 12px 16px;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
  font-size: 1.05rem;
  cursor: pointer;
  transition: transform .12s ease, filter .15s ease;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(0.985); }
.btn small { font-weight: 400; font-size: 0.85rem; opacity: 0.85; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); filter: none; }

.cats {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.cat {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  grid-template-areas: "ico name he" "ico desc desc" "ico best best";
  column-gap: 12px;
  align-items: baseline;
  padding: 14px 16px;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: background .15s ease;
}
.cat:first-child { border-top: 0; }
@media (hover: hover) { .cat:hover { background: var(--accent-soft); } }
.cat:focus-visible { outline-offset: -3px; border-radius: 0; }
.cat .badge { grid-area: ico; align-self: center; }
.badge { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
/* les jeux prennent chacun une couleur de l'arc */
.badge.tint { color: var(--tint); background: color-mix(in srgb, var(--tint) 16%, var(--surface)); }
.ico { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ico .fill { fill: currentColor; stroke: none; }
.ico-he { font-family: var(--f-display); font-size: 19px; font-weight: 700; fill: currentColor; stroke: none; }
.cat .name { grid-area: name; font-weight: 700; font-size: 1.05rem; }
.cat .he { grid-area: he; justify-self: end; color: var(--muted); font-size: 1.05rem; }
.cat .desc { grid-area: desc; color: var(--muted); font-size: 0.9rem; }
.cat .best { grid-area: best; margin-top: 2px; color: var(--accent); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.cat .best b { color: inherit; }

.src { margin: 10px 0 0; color: var(--muted); font-size: 0.82rem; }

.about p { margin: 0 0 8px; color: var(--muted); font-size: 0.9rem; max-width: 60ch; }
.about a { color: var(--accent); font-weight: 700; }

.foot {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
  padding-block: 14px calc(28px + var(--inset-bottom));
  color: var(--muted);
  font-size: 0.82rem;
  border-top: 1px solid var(--line);
}
.foot p { margin: 0; }
.foot .mail { color: var(--ink); user-select: all; overflow-wrap: anywhere; }

/* ---------- Réglages : thème et langue ---------- */
.prefs { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pref {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 4px 12px 4px 8px;
  border: 1.5px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
}
.pref .ico { width: 20px; height: 20px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg-b { min-height: 33px; padding: 4px 12px; border: 0; background: transparent; color: var(--muted); font-size: 0.85rem; font-weight: 700; cursor: pointer; }
.seg-b[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg-b:focus-visible { outline-offset: -3px; }

/* ---------- Accueil : tout tient sur un écran, les tuiles se partagent la hauteur restante ---------- */
.app.home { height: 100%; min-height: 0; gap: clamp(8px, 2vh, 20px); padding-block: 12px calc(6px + var(--inset-bottom)); }
.home .brand { gap: 2px; }
.home .brand svg { max-width: clamp(104px, 20vh, 230px); }
.home .brand h1 { font-size: clamp(1.5rem, 4.3vh, 2.15rem); }
.home .tagline { font-size: clamp(0.85rem, 2.1vh, 1rem); }
.tiles {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: clamp(8px, 1.6vh, 12px);
}
.tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(2px, 0.8vh, 8px);
  min-height: 0;
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  text-align: center;
  cursor: pointer;
  transition: border-color .15s ease, transform .12s ease;
}
.tile:active { transform: scale(0.98); }
@media (hover: hover) { .tile:hover { border-color: var(--accent); } }
.tile .badge { width: clamp(38px, 7.4vh, 58px); height: clamp(38px, 7.4vh, 58px); border-radius: 28%; }
.tile .ico { width: 58%; height: 58%; }
.tile .name { font-weight: 700; font-size: clamp(0.95rem, 2.4vh, 1.1rem); line-height: 1.2; }
.tile .he { color: var(--muted); font-size: clamp(0.85rem, 2.1vh, 1rem); line-height: 1.2; }
.home-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 18px; }
.home-links .link { margin: 0; padding: 6px 4px; font-size: 0.85rem; }
/* écran très bas (téléphone couché) : l'accueil reprend un défilement normal */
@media (max-height: 520px) {
  .app.home { height: auto; }
  .tiles { grid-template-rows: none; grid-auto-rows: minmax(96px, auto); }
}

.best-line { margin: 0; color: var(--muted); font-size: 0.9rem; }
.best-line b { color: var(--ink); }

/* ---------- Quiz ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.link {
  border: 0;
  background: transparent;
  color: var(--accent);
  font-weight: 700;
  padding: 8px 4px;
  margin-left: -4px;
  cursor: pointer;
}
.topbar .cat-name { color: var(--muted); font-size: 0.9rem; text-align: right; min-width: 0; }
.gauge { display: flex; justify-content: center; margin-top: -8px; }
.gauge svg { width: 100%; max-width: 230px; height: auto; display: block; }
.seg { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke .25s ease; }
.seg.todo { stroke: var(--line); }
.seg.cur { stroke: var(--accent); }
.seg.good { stroke: var(--good); }
.seg.bad { stroke: var(--bad); }
.g-num { font-family: var(--f-display); font-size: 34px; font-weight: 700; fill: var(--ink); font-variant-numeric: tabular-nums; }
.g-sub { font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; fill: var(--muted); }

.qhead { display: flex; flex-direction: column; gap: 10px; margin-top: -8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
}
.chip.lvl-3 { background: var(--bad-soft); color: var(--bad); }
.question {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 500;
  font-size: 1.5rem;
  line-height: 1.3;
  text-wrap: balance;
}

.choices { display: flex; flex-direction: column; gap: 10px; }
.choice {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 58px;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  text-align: left;
  cursor: pointer;
  transition: border-color .15s ease, background .2s ease, opacity .2s ease;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:disabled { cursor: default; color: var(--ink); }
.choice .letter {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--f-display);
  font-size: 1.15rem;
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--accent);
}
.choice .txt { min-width: 0; flex: 1; }
.choice .mark { flex: none; font-weight: 700; font-size: 1.1rem; }
.choice.correct { border-color: var(--good); background: var(--good-soft); }
.choice.correct .letter { background: var(--good); color: var(--surface); }
.choice.correct .mark { color: var(--good); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.wrong .letter { background: var(--bad); color: var(--surface); }
.choice.wrong .mark { color: var(--bad); }
.choice.dim { opacity: 0.5; }

.feedback {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  animation: rise .25s ease both;
}
.feedback:empty { display: none; }
.feedback p { margin: 0; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--good); }
.verdict.ko { color: var(--bad); }
.ref { color: var(--muted); font-size: 0.875rem; }
.ref b { color: var(--ink); font-weight: 700; }

.actions {
  position: sticky;
  bottom: 0;
  margin-top: auto;
  padding-block: 12px calc(16px + var(--inset-bottom));
  background: linear-gradient(to top, var(--bg) 72%, transparent);
}
/* une simple consigne ne reste pas collée en bas : elle ne doit pas recouvrir les réponses */
.actions.idle { position: static; background: none; }
.hint { margin: 0; text-align: center; color: var(--muted); font-size: 0.9rem; padding-block: 14px; }


/* ---------- Results ---------- */
.result-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.result-head h2 { margin: 0; font-family: var(--f-display); font-size: 1.7rem; line-height: 1.2; text-wrap: balance; }
.result-head p { margin: 0; color: var(--muted); max-width: 36ch; }
.record { display: inline-block; margin-top: 4px; }
.review { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.review li { display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
.review li:first-child { border-top: 0; }
.review .st { font-weight: 700; font-size: 1.05rem; line-height: 1.4; }
.review .st.ok { color: var(--good); }
.review .st.ko { color: var(--bad); }
.review .rq { margin: 0; font-size: 0.95rem; line-height: 1.4; }
.review .ra { margin: 4px 0 0; font-size: 0.875rem; color: var(--muted); }
.review .ra b { color: var(--ink); }
.review .ra s { color: var(--bad); }
.actions.stack { position: static; padding-bottom: calc(28px + var(--inset-bottom)); display: flex; flex-direction: column; gap: 10px; background: none; }

@keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<script>
const CATS = [
  { id: "torah",  name: "Torah",               he: "תורה",            desc: "Les cinq livres de Moïse",
    icon: '<path d="M4.5 20V10a3.75 3.75 0 0 1 7.5 0v10zM12 20V10a3.75 3.75 0 0 1 7.5 0v10z"/><path d="M7 12.5h2.5M7 15.5h2.5M14.5 12.5h2.5M14.5 15.5h2.5"/>' },
  { id: "neviim", name: "Prophètes et Écrits", he: "נ״ך",   desc: "Nevi’im et Ketouvim",
    icon: '<path d="M12 7c-1.9-1.4-4.2-2-7.5-2v12.5c3.3 0 5.6.6 7.5 2 1.9-1.4 4.2-2 7.5-2V5c-3.3 0-5.6.6-7.5 2z"/><path d="M12 7v12.5"/>' },
  { id: "second", name: "Second Temple",       he: "בית שני",          desc: "La période intertestamentaire",
    icon: '<path d="M3.5 9.5 12 4.5l8.5 5z"/><path d="M6 12v6M10 12v6M14 12v6M18 12v6"/><path d="M3.5 20.5h17"/>' },
  { id: "fetes",  name: "Fêtes juives",        he: "מועדי ישראל",      desc: "Les fêtes d’Israël et leur sens",
    icon: '<rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/><circle class="fill" cx="12" cy="15" r="1.6"/>' },
  { id: "lois",   name: "Les sept lois",       he: "שבע מצוות",        desc: "Les lois noahides et leurs sources",
    icon: '<path d="M12 4v16M8 20h8M5.5 7.5h13"/><path d="M5.5 7.5 3 13.5a2.7 2.7 0 0 0 5 0zM18.5 7.5 16 13.5a2.7 2.7 0 0 0 5 0z"/>' },
  { id: "hebreu", name: "Hébreu biblique",     he: "לשון הקודש",       desc: "Mots et notions clés",

function applyPrefs() {
  const root = document.documentElement;
  root.lang = lang;

  // et fond de la fenêtre de la couleur de la page (visible derrière les barres sur les anciennes WebView).
  const native = window.Capacitor?.Plugins;
  native?.SystemBars?.setStyle({ style: theme === "dark" ? "DARK" : theme === "light" ? "LIGHT" : "DEFAULT" })?.catch?.(() => {});
  native?.AppTheme?.setBackground({ color: getComputedStyle(root).getPropertyValue("--bg").trim() })?.catch?.(() => {});
}
applyPrefs();

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyPrefs);

const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function loadBest() { try { return JSON.parse(localStorage.getItem("bnq-best") || "{}") || {}; } catch (e) { return {}; } }

// Enregistre le record d'un jeu (lower : le plus petit score gagne). Renvoie true si le record est battu.
function saveGameBest(id, value, lower = false) {
  const best = loadBest(), key = "jeu-" + id, old = best[key];
  const better = old == null || (lower ? value < old : value > old);
  if (better) { best[key] = value; saveBest(best); }
  return better;
}

const praise = ratio =>
  ratio === 1 ? T("Parfait. Kol hakavod !", "Perfect. Kol hakavod!") :

/* ---------- SVG arcs ---------- */
const CX = 120, CY = 122;
const pt = (r, t) => `${(CX + r * Math.cos(t)).toFixed(2)} ${(CY - r * Math.sin(t)).toFixed(2)}`;

function heroArc() {
  let bands = "";
  for (let i = 0; i < 7; i++) {
    const r = 110 - i * 9.5;
    bands += `<path class="band" style="stroke:var(--k${i + 1})" d="M ${pt(r, Math.PI)} A ${r} ${r} 0 0 1 ${pt(r, 0)}"/>`;
  }
  return `<svg viewBox="0 0 240 126" role="img" aria-label="${T("Arc-en-ciel de sept bandes, signe de l’alliance avec Noé", "Rainbow of seven bands, the sign of the covenant with Noah")}">
    ${bands}<text class="hero-he" x="${CX}" y="${CY - 6}" text-anchor="middle">בני נח</text></svg>`;
}

function gauge(states, big, sub) {
  const n = states.length, r = 100, sw = 12;
  const slot = Math.PI / n, cap = (sw / 2) / r, gap = 0.035;
  let segs = "";
  states.forEach((s, i) => {
    const t1 = Math.PI - i * slot - cap - gap / 2;
    const t2 = Math.PI - (i + 1) * slot + cap + gap / 2;
    segs += `<path class="seg ${s}" d="M ${pt(r, t1)} A ${r} ${r} 0 0 1 ${pt(r, t2)}"/>`;
  });
  return `<svg viewBox="0 0 240 130" aria-hidden="true">${segs}
    <text class="g-num" x="${CX}" y="${CY - 22}" text-anchor="middle">${big}</text>
    <text class="g-sub" x="${CX}" y="${CY - 4}" text-anchor="middle">${sub.toUpperCase()}</text></svg>`;
}

function renderQuiz() {
  const s = state, n = s.list.length;
  const q = L(Q[s.list[s.idx]]), order = s.orders[s.idx], pick = s.picks[s.idx];
  const answered = pick != null;
  const score = s.picks.filter(p => p === 0).length;
  const segs = s.list.map((_, i) => {
    if (i < s.idx) return s.picks[i] === 0 ? "good" : "bad";
    if (i === s.idx) return answered ? (pick === 0 ? "good" : "bad") : "cur";
    return "todo";
  });
  const last = s.idx === n - 1;

  $app.innerHTML = `
    <div class="topbar">
      <button class="link" data-themes id="quit">${TXT.quit}</button>
      <span class="cat-name">${catName(s.cat)} · score <b>${score}</b></span>
    </div>

    <div class="gauge">${gauge(segs, `${s.idx + 1}/${n}`, "question")}</div>

    <div class="qhead">
      <div class="chips">
        ${s.cat === "mix" ? `<span class="chip">${catName(q.c)}</span>` : ""}
        <span class="chip lvl-${q.l}">${lvlName(q.l)}</span>
      </div>
      <h2 class="question" tabindex="-1" id="q-text">${fr(q.q)}</h2>
    </div>

    <div class="choices" role="group" aria-label="${TXT.answers}">
      ${order.map((ai, k) => {
        let cls = "", mark = "";
        if (answered) {
          if (ai === 0) { cls = "correct"; mark = `<span class="mark" aria-label="${T("bonne réponse", "correct answer")}">✓</span>`; }
          else if (ai === pick) { cls = "wrong"; mark = `<span class="mark" aria-label="${T("votre réponse", "your answer")}">✗</span>`; }
          else cls = "dim";
        }
        return `<button class="choice ${cls}" data-pick="${k}" id="choice-${k}" ${answered ? "disabled" : ""}>
          <span class="letter" aria-hidden="true">${LETTERS[k]}</span><span class="txt">${fr(q.a[ai])}</span>${mark}</button>`;
      }).join("")}
    </div>

    <div class="feedback" aria-live="polite">${answered ? `
      <p class="verdict ${pick === 0 ? "ok" : "ko"}">${pick === 0 ? T("Bonne réponse", "Correct") : fr(TXT.notQuite + q.a[0])}</p>
      <p>${fr(q.x)}</p>
      <p class="ref">${TXT.source}<b>${q.r}</b></p>` : ""}</div>

    <div class="actions${answered ? "" : " idle"}">
      ${answered
        ? `<button class="btn" data-next id="next">${last ? TXT.seeScore : T("Question suivante", "Next question")}</button>`
        : `<p class="hint">${T("Touchez une réponse", "Tap an answer")}</p>`}

function render(focusId) {
  $app.className = state.screen === "home" ? "app home" : "app";   // l'accueil tient sur un seul écran
  if (state.screen === "quiz") renderQuiz();
  else if (state.screen === "results") renderResults();
  else if (state.screen === "themes") renderThemes();
  else if (state.screen === "about") renderAbout();
  else if (state.screen === "game") $app.innerHTML = gameOf(state.game).render(state.g);
  else renderHome();
  if (focusId) document.getElementById(focusId)?.focus({ preventScroll: true });
}

/* ---------- Actions ---------- */
// Ouvre un écran sans partie en cours : l'accueil ("home"), les thèmes du quiz ("themes") ou « À propos » ("about")
function go(screen) {
  state = { screen };
  window.scrollTo(0, 0);
  render();
}

function start(cat) {
  const pool = Q.map((q, i) => i).filter(i => cat === "mix" || Q[i].c === cat);
  const list = shuffle(pool).slice(0, PER_ROUND);
  state = { screen: "quiz", cat, list, orders: list.map(() => shuffle([0, 1, 2, 3])), idx: 0, picks: [] };
  window.scrollTo(0, 0);
  render("q-text");
}
function pick(k) {
  if (state.picks[state.idx] != null) return;
  state.picks[state.idx] = state.orders[state.idx][k];
  render("next");
}
function next() {
  if (state.idx < state.list.length - 1) {
    state.idx++;
    window.scrollTo(0, 0);
    render("q-text");
    return;
  }
  const score = state.picks.filter(p => p === 0).length;
  const best = loadBest();
  state.newRecord = best[state.cat] == null || score > best[state.cat];
  if (state.newRecord) { best[state.cat] = score; saveBest(best); }
  state.screen = "results";
  window.scrollTo(0, 0);
  render("replay");
}

$app.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a && state.screen === "game") { gameOf(state.game).act(a.dataset.act, a, state.g, e); return; }
  const b = e.target.closest("button");
  if (!b) return;
  const d = b.dataset;
  if (d.start) start(d.start);
  else if (d.game) startGame(d.game);
  else if (d.lang) setLang(d.lang);
  else if ("themeNext" in d) nextTheme();
  else if ("install" in d) install();
  else if (d.pick != null) pick(+d.pick);
  else if ("next" in d) next();
  else if ("replay" in d) state.screen === "game" ? startGame(state.game) : start(state.cat);
  else if ("themes" in d) go("themes");
  else if ("about" in d) go("about");
  else if ("home" in d) go("home");
});
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (state.screen === "game") { gameOf(state.game).key?.(e, state.g); return; }
  if (state.screen !== "quiz") return;
  const k = "1234".indexOf(e.key);
  if (k >= 0 && state.picks[state.idx] == null) { e.preventDefault(); pick(k); }
});

// Bouton retour d'Android : le quiz revient à ses thèmes, le reste à l'accueil, et l'accueil quitte l'app
const CapApp = window.Capacitor?.Plugins?.App;
if (CapApp) {
  CapApp.addListener("backButton", () => {
    if (state.screen === "home") CapApp.exitApp();
    else go(state.screen === "quiz" || state.screen === "results" ? "themes" : "home");
  });
}
</script>
